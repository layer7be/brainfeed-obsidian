name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip releases triggered by the version bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Bump patch version
        id: version
        run: |
          # Read current version from manifest.json
          current=$(node -p "require('./manifest.json').version")
          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          next="${major}.${minor}.${patch}"

          # Update manifest.json and package.json
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${next}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');

            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${next}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

          # Update versions.json — map new version to minAppVersion from manifest
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const v = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            v['${next}'] = m.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(v, null, 2) + '\n');
          "

          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json versions.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            main.js manifest.json styles.css \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
